[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwrt-ai-tools"
version = "0.1.0"
description = "Public GitHub PR review and future issue triage using ChatGPT Work"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["openwrt_ai*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
